<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101923">
    <!--
    CSS Files 
    -->

    <link rel="stylesheet" href="/group-haven/css/main.css">
    <link rel="stylesheet" href="/group-haven/css/map.css">
    <link rel="stylesheet" href="/group-haven/css/components.css">


    <title>Local — Event Discovery Prototype</title>


</head>
<body>
    <div class="app">

        <!-- Fake Map (For Now)  -->
        <div class="map" id="map">
            <div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div>
            <div class="park-label p1">OAK PARK</div><div class="park-label p2">RIVER GREENWAY</div>
            <div class="road-label a">Market Street </div><div class="road-label b">West Avenue</div><div class="road-label c">Main St.</div>
        </div>


        <!-- Date Panel -->
        <header class="topbar">
            <div class="brandrow">
                <div class="brand"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="2.5" /></svg></span>Group Haven</div>
                <button class="location-pill" id="locationBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-7.5 8-13a8 8 0 1 0-16 0c0 5.5 8 13 8 13Z" /><circle cx="12" cy="9" r="2.5" /></svg> Downtown · Warrensburg ▾</button>
            </div>
            <section class="datepanel">
                <div class="datehead"><strong>Explore by date</strong><span id="dateCaption">This week</span></div>
                <div class="dates" id="dateButtons"></div>
                <div class="datehint"><span>← Earlier</span><span>Choose a day to filter events </span><span>Later →</span></div>
            </section>
        </header>

        <!-- Pins for the map -->
        <div id="pins"></div>

        <div class="map-tools">
            <button class="toolbtn" id="locateBtn" aria-label="My location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2" /><path d="M12 2v3m0 14v3M2 12h3m14 0h3" /></svg></button>
        </div>

        <article class="eventcard" id="eventCard">
            <div class="cardtop"><span class="category" id="eventCategory">✦ Community</span><button class="close" id="closeCard" aria-label="Close">×</button></div>
            <h2 id="eventTitle">Event title</h2>
            <p class="description" id="eventDescription"></p>
            <div class="details">
                <div class="detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg><span id="eventTime"></span></div>
                <div class="detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="2.5" /></svg><span id="eventPlace"></span></div>
                <div class="detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" /><path d="M8 12h8m-4-4v8" /></svg><span id="eventPrice"></span></div>
                <div class="detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4" /><path d="M5 21v-2a7 7 0 0 1 14 0v2" /></svg><span id="eventContact"></span></div>
            </div>
            <div class="cardactions"><button class="addme" id="joinBtn">Add Me</button><button class="share" id="shareBtn" aria-label="Share event"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><path d="m8.6 10.7 6.8-4.4M8.6 13.3l6.8 4.4" /></svg></button></div>
        </article>


        <!-- Add Event Button -->
        <button class="addpin" id="addEventBtn" aria-label="Add an event"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" /><path d="M12 7v6m-3-3h6" /></svg></button>



        <!-- Bottom Nav Bar -->
        <nav class="bottomnav">
            <button class="navitem active" data-tab="Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z" /><path d="M9 3v15m6-12v15" /></svg>Map</button>
            <button class="navitem" data-tab="Explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4m-5-8 3 3-5 2z" /></svg>Explore</button>
            <button class="navitem" data-tab="Saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z" /></svg>Saved</button>
            <button class="navitem" data-tab="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>Profile</button>
        </nav>

        <div class="modalback" id="modalBack">


            <!-- Add Event Panel -->
            <form class="modal" id="eventForm">
                <div class="modalhead"><h3>Create an event</h3><button type="button" class="close" id="closeModal">×</button></div>
                <div class="formgrid">
                    <div class="field"><label for="newTitle">EVENT NAME</label><input id="newTitle" required placeholder="e.g. Sunday Makers Meetup"></div>
                    <div class="field"><label for="newDescription">DESCRIPTION</label><textarea id="newDescription" placeholder="What should people know?"></textarea></div>
                    <div class="formrow">
                        <div class="field"><label for="newDate">DATE</label><select id="newDate"></select></div>
                        <div class="field"><label for="newTime">TIME</label><input id="newTime" type="time" value="18:00"></div>
                    </div>
                    <div class="formrow">
                        <div class="field"><label for="newCategory">CATEGORY</label><select id="newCategory"><option>Community</option><option>Food</option><option>Music</option><option>Sports</option><option>Education</option></select></div>
                        <div class="field"><label for="newContact">CONTACT</label><input id="newContact" placeholder="Organizer"></div>
                    </div>
                    <button class="submit" type="submit">Add to prototype map</button>
                </div>

                <!-- Drag drop pin to add coordinates -->
                <div class="selected-location">
                    <strong>Event Location</strong>
                    <p id="pinCoordinates">No map location selected.</p>

                    <input type="hidden" id="eventX" name="x">
                    <input type="hidden" id="eventY" name="y">
                </div>

            </form>
        </div>

        <!-- pop-up messages for joining or dropping events -->
        <div class="toast" id="toast"></div>
    </div>
    <!--
    Script tag for javascript 
    -->

    <script src="script.js" defer></script>
</body>
</html>
